compatibility_date = "2026-08-01"

[[r2_buckets]]
binding = "SCREENSHOTS"
bucket_name = "vanahub-screenshot-staging"

[vars]
PUBLISHER_ORIGIN = "https://hildaware.github.io"
PUBLIC_BASE_URL = "https://vanahub-screenshot-upload.hildaware.workers.dev"

