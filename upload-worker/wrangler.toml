name = "vanahub-screenshot-upload"
main = "src/index.ts"
compatibility_date = "2026-08-01"

[[r2_buckets]]
binding = "SCREENSHOTS"
bucket_name = "vanahub-screenshot-staging"

[vars]
PUBLISHER_ORIGIN = "https://hildaware.github.io"
PUBLIC_BASE_URL = "https://vanahub-screenshot-upload.hildaware.workers.dev"

[[ratelimits]]
name = "UPLOAD_RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 20
  period = 60

# Add TURNSTILE_SECRET and UPLOAD_SIGNING_SECRET with `wrangler secret put`.
# Add CLEANUP_SECRET with `wrangler secret put`; use the same value in catalog CI.
# Configure the pending/ prefix to expire after 30 days through an R2 lifecycle rule.
