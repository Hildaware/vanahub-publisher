name: VanaHub Publish
description: Validate and package an addon from a published GitHub Release event or tag.
inputs:
  release-tag:
    description: Published SemVer release tag. Required outside a release event.
    required: false
  github-token:
    description: Repository token used to read release metadata when publishing by tag.
    required: false
  release-metadata-path:
    description: Path to trusted GitHub Release JSON resolved by the caller.
    required: false
  config-path:
    description: Repository-relative VanaHub package configuration.
    required: false
    default: .vanahub/package.json
  output-directory:
    description: Repository-relative output directory.
    required: false
    default: .vanahub-output
outputs:
  artifact-name:
    description: Normalized addon ZIP filename.
  output-directory:
    description: Absolute output directory.
  package-id:
    description: VanaHub package ID.
  version:
    description: SemVer parsed from the release tag.
runs:
  using: node20
  main: dist-action/index.js
