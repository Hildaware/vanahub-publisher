name: VanaHub repository setup

on:
  workflow_call:
    inputs:
      setup:
        description: Base64-encoded setup payload generated by VanaHub Publisher.
        required: true
        type: string
      publisher-ref:
        description: Immutable vanahub-publisher commit used by the generated files.
        required: true
        type: string

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Hildaware/vanahub-publisher
          ref: ${{ inputs.publisher-ref }}
          path: .vanahub-tool
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .vanahub-tool/package-lock.json
      - run: npm ci
        working-directory: .vanahub-tool
      - run: ./.vanahub-tool/node_modules/.bin/tsx .vanahub-tool/scripts/setup-repository.ts
        env:
          GH_TOKEN: ${{ github.token }}
          VANAHUB_SETUP: ${{ inputs.setup }}
